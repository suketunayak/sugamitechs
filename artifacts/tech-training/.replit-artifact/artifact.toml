kind = "web"
previewPath = "/"
title = "Tech Training Services"
version = "1.0.0"
id = "artifacts/tech-training"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21750

[services.development]
run = "pnpm --filter @workspace/tech-training run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tech-training", "run", "build" ]
publicDir = "artifacts/tech-training/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21750"
BASE_PATH = "/"
