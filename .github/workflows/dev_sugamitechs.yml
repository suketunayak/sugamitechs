name: Build and Deploy

on:
  push:
    branches:
      - main

# 1. ADD THIS GLOBAL ENV VARIABLE TO FORCE NODE 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 2. UPGRADE TO CHECKOUT@V4 (Ensure it is v4, or v4.1.1+ if available)
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      # 3. UPGRADE TO SETUP-NODE@V4 (This adds Node 24 capability)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # If using pnpm, configure setup-node to cache it:
          cache: 'pnpm' 

      # 4. INSTALL PNPM AND BUILD
      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build
